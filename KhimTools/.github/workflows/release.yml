name: Build & Release Executable & Bundle

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Build C# Revit Addin DLLs
        run: |
          dotnet build KhimTools.csproj -c Release

      - name: Publish Standalone KhiemTools Desktop App (.exe)
        run: |
          dotnet publish App/KhiemToolsApp.csproj -f net8.0-windows -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Archive Addin Bundle & Executable (ZIP)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/KhiemTools.exe -DestinationPath dist/KhiemTools_App.zip

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/KhiemTools.exe
            dist/KhiemTools_App.zip
            update_info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
