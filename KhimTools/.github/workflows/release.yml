name: Build & Release Executable & Bundle

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Publish Standalone KhiemTools Installer (.exe)
        run: |
          dotnet publish App/KhiemToolsApp.csproj -f net48 -c Release -o dist

      - name: Archive Revit Addin Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path Deploy/* -DestinationPath dist/KhimTools_Bundle.zip -Force

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/KhiemTools_Installer.exe
            dist/KhimTools_Bundle.zip
            update_info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
